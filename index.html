<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Titre et description : ce que Google affiche dans les résultats
         de recherche. Adapte le texte ci-dessous à ton activité réelle
         (et remplace "DeviFact" si tu changes de nom). -->
    <title>DeviFact — Devis, factures et gestion administrative pour artisans</title>
    <meta name="description" content="Devis, factures, révisions de prix et bien plus — l'outil de gestion administrative pensé pour les artisans et petites entreprises du bâtiment." />
    <meta name="robots" content="index, follow" />

    <!-- Adresse définitive du site — remplace par ton propre nom de
         domaine une fois qu'il est branché (voir nos échanges précédents). -->
    <link rel="canonical" href="https://www.chantiflow.fr/" />

    <!-- Aperçu affiché quand le lien est partagé sur WhatsApp, LinkedIn,
         Facebook, etc. Remplace og:image par une vraie image (1200×630px
         recommandé) une fois que tu en auras une — sans ça, certains
         réseaux n'afficheront pas d'aperçu visuel, mais le titre et la
         description s'afficheront quand même. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DeviFact" />
    <meta property="og:title" content="DeviFact — Devis, factures et gestion administrative pour artisans" />
    <meta property="og:description" content="Devis, factures, révisions de prix et bien plus — l'outil de gestion administrative pensé pour les artisans et petites entreprises du bâtiment." />
    <meta property="og:url" content="https://www.chantiflow.fr/" />
    <meta property="og:locale" content="fr_FR" />
    <!-- <meta property="og:image" content="https://www.chantiflow.fr/apercu.jpg" /> -->

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DeviFact — Devis, factures et gestion administrative pour artisans" />
    <meta name="twitter:description" content="Devis, factures, révisions de prix et bien plus — l'outil de gestion administrative pensé pour les artisans et petites entreprises du bâtiment." />

    <meta name="theme-color" content="#1B2A33" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
